[project]
name = "mxtng-auth-services"
version = "0.1.0"
description = "MXTNG Auth Service — standalone, product-generic identity provider (ADR-0005/0006/0007)."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0",
    "aiosqlite>=0.20",
    "pydantic>=2.7",
    "pydantic[email]>=2.7",
    "pydantic-settings>=2.3",
    "python-jose[cryptography]>=3.3",
    "cryptography>=42",
    "bcrypt>=4.1",
    "httpx>=0.27",
    "python-multipart>=0.0.9",
    "alembic>=1.13",
]

[project.optional-dependencies]
postgres = ["asyncpg>=0.29"]
google = ["google-auth>=2.30"]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "anyio>=4"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mxtng_auth"]

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"
testpaths = ["tests"]
